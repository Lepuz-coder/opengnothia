name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to rebuild'
        required: true
        type: string
      windows_only:
        description: 'Build only the Windows installers'
        required: false
        default: false
        type: boolean

jobs:
  release:
    name: Build signed and notarized DMG
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/web/src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Apple signing secrets
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          for secret_name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_KEY \
            APPLE_API_ISSUER \
            APPLE_API_PRIVATE_KEY_BASE64
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required GitHub secret: $secret_name"
              exit 1
            fi
          done

      - name: Install App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"

          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"

          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build and upload signed macOS DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: Emirhan Durusoy (TBV5TAGQ74)'
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        with:
          projectPath: apps/web
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: '${{ env.RELEASE_TAG }}'
          releaseBody: 'Download the signed and notarized macOS DMG or the Windows installer from the assets below.'
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' }}
          prerelease: false
          args: --target universal-apple-darwin --config src-tauri/tauri.devid.conf.json

      - name: Notarize, staple, and replace macOS DMG
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg_path="$(find "$GITHUB_WORKSPACE/apps/web/src-tauri/target/universal-apple-darwin/release/bundle/dmg" -type f -name '*.dmg' -print -quit)"

          if [[ -z "$dmg_path" ]]; then
            echo "No macOS DMG was produced."
            exit 1
          fi

          codesign --verify --strict --verbose=2 "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

          gh release upload "$RELEASE_TAG" "$dmg_path" --clobber

      - name: Verify uploaded DMG signature and notarization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset_dir="$RUNNER_TEMP/release-assets"
          mount_path="$RUNNER_TEMP/opengnothia-dmg"

          mkdir -p "$asset_dir" "$mount_path"
          gh release download "$RELEASE_TAG" --pattern '*.dmg' --dir "$asset_dir"

          dmg_path="$(find "$asset_dir" -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg_path" ]]; then
            echo "The draft release does not contain a DMG."
            exit 1
          fi

          codesign --verify --strict --verbose=2 "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg_path"

          hdiutil attach "$dmg_path" -nobrowse -readonly -mountpoint "$mount_path"

          app_path="$(find "$mount_path" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            hdiutil detach "$mount_path"
            echo "The DMG does not contain an application bundle."
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          codesign --display --verbose=4 "$app_path"
          hdiutil detach "$mount_path"

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Remove App Store Connect API key
        if: always()
        run: |
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi

  windows:
    name: Build Windows installers
    needs: release
    if: ${{ always() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/web/src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload Windows installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/web
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: '${{ env.RELEASE_TAG }}'
          releaseBody: 'Download the signed and notarized macOS DMG or the Windows installer from the assets below.'
          releaseDraft: false
          prerelease: false

      - name: Verify uploaded Windows installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          $assetNames = @($release.assets | ForEach-Object { $_.name })

          $msi = @($assetNames | Where-Object { $_ -like '*.msi' })
          $setupExe = @($assetNames | Where-Object { $_ -like '*-setup.exe' })

          if ($msi.Count -eq 0) {
            throw 'The release does not contain an MSI installer.'
          }

          if ($setupExe.Count -eq 0) {
            throw 'The release does not contain a setup EXE installer.'
          }

          Write-Host "MSI: $($msi -join ', ')"
          Write-Host "Setup EXE: $($setupExe -join ', ')"
